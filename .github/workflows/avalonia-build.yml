name: Build Avalonia

on:
  pull_request:
    branches: [ Avalonia ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore WordForge.Desktop/WordForge.Desktop.csproj
      - name: Build
        run: dotnet build WordForge.Desktop/WordForge.Desktop.csproj --no-restore
